<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MafiaAI - Live Game</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🎭 MAFIA AI</h1>
        <div class="header-info">
            <div id="game-status" class="status-badge">Waiting for game...</div>
            <div id="chip-balance">💰 1000 chips</div>
        </div>
    </header>

    <main>
        <section id="agents-panel">
            <h2>Players</h2>
            <div id="agent-cards"></div>
        </section>

        <section id="chat-panel">
            <h2>Game Log</h2>
            <div id="chat-log"></div>
        </section>
    </main>

    <section id="phase-banner">
        <div id="phase-text">LOBBY</div>
    </section>

    <footer>
        <section id="vote-display">
            <h3>Votes</h3>
            <div id="vote-list"></div>
        </section>

        <section id="betting-panel">
            <h3>Betting</h3>
            <div id="odds-display">
                <div class="odds-row">
                    <span>😈 Mafia Win:</span>
                    <strong class="odds-value">50.0%</strong>
                </div>
                <div class="odds-row">
                    <span>🎉 Citizens Win:</span>
                    <strong class="odds-value">50.0%</strong>
                </div>
            </div>
            <div id="bet-controls">
                <div class="bet-amount-selector">
                    <button class="bet-amount" data-amount="25">25</button>
                    <button class="bet-amount selected" data-amount="50">50</button>
                    <button class="bet-amount" data-amount="100">100</button>
                    <button class="bet-amount" data-amount="all">ALL</button>
                </div>
                <div class="bet-buttons">
                    <button class="bet-btn mafia-btn" onclick="placeBet('side_win', 'mafia')">
                        😈 Bet Mafia
                    </button>
                    <button class="bet-btn citizen-btn" onclick="placeBet('side_win', 'citizens')">
                        🎉 Bet Citizens
                    </button>
                </div>
            </div>
            <div id="bet-history"></div>
        </section>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
